<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문 기록 조회 · 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0e11;
    --panel: #12161b;
    --panel-2: #171c22;
    --line: #23292f;
    --amber: #f5a623;
    --amber-dim: #7a5716;
    --text: #e7ebee;
    --text-dim: #8b95a1;
    --ok: #38d67a;
    --wait: #5b8ff0;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 32px 20px 80px;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px;
    background-attachment: fixed;
  }
  .wrap{ max-width: 880px; margin: 0 auto; }

  header{ margin-bottom: 28px; }
  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--amber);
    text-transform: uppercase;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{
    content:''; width:8px; height:8px; background: var(--amber);
    display:inline-block; box-shadow: 0 0 8px var(--amber);
  }
  h1{
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 4vw, 38px);
    margin-top: 8px;
    letter-spacing: -0.01em;
  }
  .sub{ color: var(--text-dim); margin-top: 6px; font-size: 14px; }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .panel-title{
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
    display:flex; align-items:center; justify-content: space-between;
  }

  .row{ display:flex; gap: 14px; flex-wrap: wrap; }
  .field{ flex:1; min-width: 160px; }
  .field label{
    display:block; font-size: 12px; color: var(--text-dim);
    margin-bottom: 6px; font-family: 'JetBrains Mono', monospace;
  }
  .field input{
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 11px 12px;
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus{ border-color: var(--amber); }

  /* 공정 버튼 */
  .process-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 200px));
    gap: 14px;
    margin-top: 18px;
  }
  .proc-btn{
    position: relative;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 18px 10px 14px;
    border-radius: 3px;
    cursor: pointer;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
    transition: all .12s ease;
    text-align: center;
  }
  .proc-btn:hover{ border-color: var(--amber-dim); transform: translateY(-1px); }
  .proc-btn .code{
    display:block; font-family:'JetBrains Mono',monospace; font-weight:400;
    font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .proc-btn.selected{
    border-color: var(--amber);
    background: linear-gradient(180deg, rgba(245,166,35,0.14), rgba(245,166,35,0.04));
    box-shadow: 0 0 0 1px var(--amber) inset;
  }

  /* 공정 흐름 시각화 */
  .flow{
    display:flex; align-items:center; flex-wrap: wrap; gap: 4px;
    margin-top: 18px; min-height: 34px;
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
  }
  .flow-empty{ color: var(--text-dim); font-size: 13px; }
  .flow-chip{
    background: var(--panel-2); border:1px solid var(--amber-dim);
    color: var(--amber); padding: 5px 10px; border-radius: 3px;
  }

  .actions{ display:flex; justify-content: flex-end; margin-top: 22px; gap: 10px; }
  button.primary{
    background: var(--amber);
    color: #161006;
    border: none;
    padding: 12px 26px;
    border-radius: 3px;
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: filter .12s;
  }
  button.primary:hover{ filter: brightness(1.08); }
  button.primary:disabled{ opacity: .35; cursor: not-allowed; }
  button.ghost{
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
    padding: 12px 18px; border-radius: 3px; font-family:'Inter',sans-serif;
    font-size: 13px; cursor: pointer;
  }
  button.ghost:hover{ border-color: var(--text-dim); color: var(--text); }

  /* 주문 목록 */
  .order-list{ display:flex; flex-direction: column; gap: 10px; }
  .order-item{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--wait);
    border-radius: 3px;
    padding: 14px 16px;
    display:flex; justify-content: space-between; align-items:center; gap:16px;
    flex-wrap: wrap;
  }
  .order-item.done{ border-left-color: var(--ok); }
  .order-id{
    font-family:'JetBrains Mono',monospace; font-size:12px; color: var(--text-dim);
  }
  .order-name{ font-family:'Chakra Petch',sans-serif; font-weight:600; font-size:15px; margin-top:2px;}
  .order-meta{ font-size:12px; color:var(--text-dim); margin-top:4px; }
  .order-status{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    padding: 4px 10px; border-radius: 20px; text-transform:uppercase; letter-spacing:.06em;
    background: rgba(91,143,240,0.12); color: var(--wait); border: 1px solid rgba(91,143,240,0.35);
    white-space: nowrap; cursor: pointer;
  }
  .order-status.done{
    background: rgba(56,214,122,0.12); color: var(--ok); border-color: rgba(56,214,122,0.35);
  }
  .order-status.failed{
    background: rgba(255,86,86,0.12); color: #ff6b6b; border-color: rgba(255,86,86,0.35);
  }
  .manual-test{
    width:100%; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
  }
  .manual-label{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--amber);
    letter-spacing:.06em; margin-bottom:8px;
  }
  .manual-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .manual-actions button{
    background:transparent; border:1px solid var(--amber-dim); color:var(--amber);
    padding:7px 14px; border-radius:3px; cursor:pointer;
  }
  .manual-actions button:disabled{ opacity:.35; cursor:not-allowed; }
  .judgment{ font-family:'JetBrains Mono',monospace; font-size:12px; }
  .judgment.ok{ color:var(--ok); }
  .judgment.ng{ color:#ff6b6b; }
  .notice{ min-height:20px; margin-top:12px; font-size:12px; color:var(--text-dim); }
  .empty-state{
    text-align:center; padding: 40px 20px; color: var(--text-dim); font-size: 14px;
  }
  .empty-state .big{
    font-family:'Chakra Petch',sans-serif; font-size: 16px; color: var(--text); margin-bottom:6px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">FACTORY ORDER SYSTEM</div>
    <h1>주문 기록 조회 · 관리</h1>
    <div class="sub">주문은 Pi 로컬 사이트에서 등록합니다. 이 화면에서는 주문 기록을 조회하고 삭제합니다.</div>
  </header>

  <div class="panel">
    <a href="http://192.168.1.1:8000/order-system.html" style="color:var(--amber)">Pi 로컬 주문 사이트 열기</a>
    <div class="sub">Pi와 같은 네트워크에서 접속하세요.</div>
    <div class="notice" id="notice"></div>
  </div>

  <div class="panel">
    <div class="panel-title">주문 목록 <span id="orderCount" style="color:var(--text-dim); font-weight:400; text-transform:none;"></span></div>
    <div class="manual-actions" style="margin-bottom:16px;">
      <label><input type="checkbox" id="selectAllOrders"> 조회된 주문 전체 선택 (최대 50건)</label>
      <button type="button" id="deleteSelectedOrders" disabled>선택 주문 DB 영구 삭제 (0건)</button>
    </div>
    <div class="sub">선택 삭제 시 DB의 주문과 연결된 판정 기록도 영구 삭제됩니다. 설비에 전달된 동작 신호는 취소되지 않습니다.</div>
    <div class="order-list" id="orderList"></div>
  </div>
</div>

<script>
let orders = [];
const selectedOrderIds = new Set();
let deletingOrders = false;
let ordersLoadVersion = 0;
let requestInProgress = false;

const orderList = document.getElementById('orderList');
const orderCount = document.getElementById('orderCount');
const notice = document.getElementById('notice');

function escapeHtml(value)
{
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function setNotice(message, isError = false)
{
  notice.textContent = message;
  notice.style.color = isError ? '#ff6b6b' : 'var(--text-dim)';
}

async function apiRequest(path, options = {})
{
  const response = await fetch(path, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok)
  {
    throw new Error(payload.message || payload.error || `HTTP ${response.status}`);
  }
  return payload;
}





function statusClass(status)
{
  if (status === 'COMPLETED') return 'done';
  if (status === 'FAILED') return 'failed';
  return '';
}

function manualTestView(order)
{
  if (order.judgment)
  {
    return `<div class="manual-test">
      <div class="manual-label">YOLO TEST / MANUAL TEST</div>
      <div class="judgment ${order.judgment.toLowerCase()}">
        주문 ${escapeHtml(order.requested_product)} / 검출 ${escapeHtml(order.detected_product)} / 판정 ${escapeHtml(order.judgment)}
        · MQTT ${escapeHtml(order.judgment_dispatch_state || 'PENDING')}
      </div>
    </div>`;
  }
  const disabled = order.status !== 'STARTED' ? 'disabled' : '';
  const hint = order.status === 'STARTED'
    ? '실제 YOLO가 아닌 수동 검출값을 선택하세요.'
    : 'PROCESS_START 전송 후 STARTED 상태에서 입력할 수 있습니다.';
  return `<div class="manual-test">
    <div class="manual-label">YOLO TEST / MANUAL TEST</div>
    <div class="manual-actions">
      <button data-detect="A" data-order-id="${escapeHtml(order.order_id)}" ${disabled}>검출 A</button>
      <button data-detect="B" data-order-id="${escapeHtml(order.order_id)}" ${disabled}>검출 B</button>
      <span class="order-meta">${hint}</span>
    </div>
  </div>`;
}

function renderOrders()
{
  const available = new Set(orders.map(o => o.order_id));
  for(const id of selectedOrderIds)if(!available.has(id))selectedOrderIds.delete(id);
  const all = document.getElementById('selectAllOrders');
  all.disabled = deletingOrders || orders.length === 0;
  all.checked = orders.length > 0 && selectedOrderIds.size === orders.length;
  all.indeterminate = selectedOrderIds.size > 0 && selectedOrderIds.size < orders.length;
  const remove = document.getElementById('deleteSelectedOrders');
  remove.disabled = deletingOrders || requestInProgress || selectedOrderIds.size === 0;
  remove.textContent = `선택 주문 DB 영구 삭제 (${selectedOrderIds.size}건)`;
  orderCount.textContent = orders.length ? `(${orders.length})` : '';
  if (orders.length === 0)
  {
    orderList.innerHTML = `<div class="empty-state">
      <div class="big">등록된 주문이 없습니다</div>
      주문은 Pi 로컬 주문 사이트에서 등록하세요.
    </div>`;
    return;
  }
  orderList.innerHTML = orders.map((order) => `
    <div class="order-item ${statusClass(order.status)}">
      <div>
        <label><input type="checkbox" data-select-order="${escapeHtml(order.order_id)}" ${selectedOrderIds.has(order.order_id) ? 'checked' : ''} ${deletingOrders ? 'disabled' : ''}> 삭제할 주문 선택</label>
        <div class="order-id">${escapeHtml(order.order_id)}</div>
        <div class="order-name">${escapeHtml(order.product_name)}</div>
        <div class="order-meta">${escapeHtml(order.requested_product)}가공 · 생성 ${escapeHtml(order.created_at)}</div>
      </div>
      <div class="order-status ${statusClass(order.status)}">${escapeHtml(order.status)}</div>
      ${manualTestView(order)}
    </div>
  `).join('');

  orderList.querySelectorAll('[data-select-order]').forEach(box => box.addEventListener('change', () => {
    if(deletingOrders)return;
    box.checked ? selectedOrderIds.add(box.dataset.selectOrder) : selectedOrderIds.delete(box.dataset.selectOrder);
    renderOrders();
  }));
  orderList.querySelectorAll('[data-detect]').forEach((button) =>
  {
    button.addEventListener('click', () => runManualDetection(
      button.dataset.orderId,
      button.dataset.detect,
    ));
  });
}

async function loadOrders(showError = true)
{
  if(deletingOrders)return;
  const version=++ordersLoadVersion;
  try
  {
    const payload = await apiRequest('/api/process-orders?limit=50');
    if(deletingOrders || version !== ordersLoadVersion)return;
    orders = payload.orders || [];
    renderOrders();
  }
  catch (error)
  {
    if (showError) setNotice(`주문 조회 실패: ${error.message}`, true);
  }
}


async function runManualDetection(orderId, detectedProduct)
{
  try
  {
    const result = await apiRequest(`/api/process-orders/${orderId}/manual-detection`, {
      method: 'POST',
      body: JSON.stringify({ detected_product: detectedProduct }),
    });
    setNotice(`MANUAL 판정 완료: ${result.requested_product} + ${result.detected_product} → ${result.judgment}`);
    await loadOrders(false);
  }
  catch (error)
  {
    setNotice(`수동 판정 실패: ${error.message}`, true);
  }
}

async function deleteSelectedOrders()
{
  if (deletingOrders || requestInProgress || selectedOrderIds.size === 0) return;
  const ids = [...selectedOrderIds];
  if (!window.confirm(`선택한 주문 ${ids.length}건과 연결된 판정 기록을 Supabase에서 한 번에 영구 삭제합니다.\n복구할 수 없으며 이미 전달된 설비 동작 신호는 취소되지 않습니다.\n\n선택한 주문을 모두 삭제하시겠습니까?`)) return;
  deletingOrders = true;
  ++ordersLoadVersion;
  renderOrders();
  try
  {
    const result = await apiRequest('/api/process-orders/bulk-delete', {
      method: 'POST',
      headers: { 'X-Order-Delete': 'permanent' },
      body: JSON.stringify({ order_ids: ids, confirm_order_ids: ids }),
      signal: AbortSignal.timeout(25000),
    });
    if (result.deleted !== true || result.deleted_count !== ids.length ||
        !Array.isArray(result.order_ids) || result.order_ids.length !== ids.length ||
        new Set(result.order_ids).size !== ids.length ||
        !result.order_ids.every((id) => ids.includes(id))) throw new Error('일괄 삭제 확인 응답이 올바르지 않습니다.');
    const deleted = new Set(ids);
    orders = orders.filter((order) => !deleted.has(order.order_id));
    ids.forEach((id) => selectedOrderIds.delete(id));
    setNotice(`선택한 주문 ${ids.length}건 및 연결된 판정 기록 영구 삭제 완료`);
  }
  catch (error)
  {
    setNotice(`일괄 삭제 확인 실패: ${error.message} · 목록을 확인하세요.`, true);
  }
  finally
  {
    deletingOrders = false;
      renderOrders();
    await loadOrders(false);
  }
}

document.getElementById('selectAllOrders').addEventListener('change', e => {
  if(deletingOrders)return;
  selectedOrderIds.clear();
  if(e.target.checked)orders.forEach(o => selectedOrderIds.add(o.order_id));
  renderOrders();
});
document.getElementById('deleteSelectedOrders').addEventListener('click', deleteSelectedOrders);

loadOrders();
setInterval(() => loadOrders(false), 3000);
</script>
</body>
</html>
