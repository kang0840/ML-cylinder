<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스마트 실린더 카메라</title>
<style>:root{--bg:#0a0d10;--panel:#141a20;--edge:#2b3540;--text:#e7ebef;--muted:#75808c;--run:#3ddc84;--warn:#ffb020;--fault:#ff5c5c;--info:#4fc3f7}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:Consolas,"Noto Sans KR",sans-serif}.window{min-height:100%;display:flex;flex-direction:column}.bar,.footer{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--edge)}.left,.right{display:flex;align-items:center;gap:10px}.dot,.led{width:8px;height:8px;border-radius:50%;background:var(--warn)}.chip,.nav{padding:8px 11px;border:1px solid var(--info);border-radius:6px;color:var(--info);text-decoration:none}.viewport{position:relative;flex:1;min-height:420px;display:grid;place-items:center;background:#05070a}.feed{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}.feed.visible{opacity:1}.state{text-align:center;color:var(--muted);z-index:2}.state.hidden{display:none}.camera{font-size:48px;margin-bottom:18px}.message{color:var(--text);margin-bottom:10px}.error{display:none;color:var(--fault);margin-top:14px}.error.visible{display:block}.retry{margin-top:15px;padding:8px 16px;background:var(--panel);border:1px solid var(--edge);color:var(--text)}.footer{border-top:1px solid var(--edge);border-bottom:0;color:var(--muted)}</style></head><body><main class="window">
<header class="bar"><div class="left"><span class="dot" id="topDot"></span><strong>스마트 실린더 카메라</strong></div><div class="right"><span class="chip" id="status">연결 중</span><a class="nav" href="monitoring.html">← 상태 모니터</a></div></header>
<section class="viewport"><img class="feed" id="feed" alt="Raspberry Pi 카메라 실시간 영상"><div class="state" id="state"><div class="camera">📷</div><div class="message">카메라 연결 중…</div><div>라즈베리 파이 카메라 신호를 기다리고 있습니다.</div><div class="error" id="error">카메라 스트림이 아직 연결되지 않았습니다.<br>라즈베리 파이 영상 서버를 확인해 주세요.<br><button class="retry" id="retry">다시 연결</button></div></div></section>
<footer class="footer"><span class="left"><span class="led" id="led"></span><span id="signal">신호 대기</span></span><span id="clock">--:--:--</span></footer></main>
<script>const API_ROOT=location.hostname.endsWith('github.io')?'https://ml-cylinder.onrender.com':location.origin,feed=document.getElementById('feed'),state=document.getElementById('state'),errorBox=document.getElementById('error'),statusEl=document.getElementById('status'),led=document.getElementById('led'),signal=document.getElementById('signal'),topDot=document.getElementById('topDot');let timer;function paint(mode){const color=mode==='live'?'var(--run)':mode==='error'?'var(--fault)':'var(--warn)';statusEl.textContent=mode==='live'?'실시간 연결':mode==='error'?'연결 안 됨':'연결 중';statusEl.style.color=color;led.style.background=topDot.style.background=color;signal.textContent=mode==='live'?'영상 수신 중':mode==='error'?'신호 없음':'신호 대기'}function failed(){clearTimeout(timer);feed.classList.remove('visible');state.classList.remove('hidden');errorBox.classList.add('visible');paint('error')}function connect(){clearTimeout(timer);errorBox.classList.remove('visible');paint('wait');feed.src=API_ROOT+'/stream?t='+Date.now();timer=setTimeout(failed,8000)}feed.onload=()=>{clearTimeout(timer);feed.classList.add('visible');state.classList.add('hidden');paint('live')};feed.onerror=failed;document.getElementById('retry').onclick=connect;setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour12:false}),1000);connect();</script></body></html>
