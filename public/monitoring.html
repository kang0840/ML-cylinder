<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>스마트 실린더 실시간 모니터링</title>
<style>
:root{--bg:#071014;--panel:#101b21;--line:#263943;--text:#eaf2f5;--muted:#89a0aa;--blue:#42c7ff;--green:#3ce28b;--red:#ff626b;--yellow:#ffc04c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#10303a,transparent 34%),var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1280px;margin:auto;padding:24px}header,.card{border:1px solid var(--line);background:linear-gradient(145deg,#14242c,var(--panel));border-radius:14px}header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;margin-bottom:18px}h1{margin:0 0 5px;font-size:23px}.muted{color:var(--muted);font-size:12px}.connection{font:12px monospace;color:var(--yellow)}.connection.ok{color:var(--green)}.connection.bad{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{padding:18px}.label{color:var(--muted);font-size:11px}.value{display:block;margin-top:9px;font:700 22px monospace}.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.chart-card{padding:18px}.chart-card h2{font-size:15px;margin:0 0 4px}canvas{width:100%;height:250px;margin-top:12px;background:#081116;border:1px solid #203039;border-radius:8px}.note{margin-top:18px;padding:14px 18px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:12px}.forward{color:var(--green)}.backward{color:var(--blue)}.idle{color:var(--muted)}.fault{color:var(--red)}@media(max-width:850px){.grid,.charts{grid-template-columns:1fr 1fr}}@media(max-width:540px){.wrap{padding:12px}.grid,.charts{grid-template-columns:1fr}header{align-items:flex-start;gap:14px;flex-direction:column}}
</style></head><body><main class="wrap">
<header><div><h1>스마트 실린더 실시간 데이터</h1><div class="muted">Pi 5 · 진동 · 소음 · 누설 추론 · 전진/후진 위치</div></div><div id="connection" class="connection">연결 확인 중</div></header>
<section class="grid">
 <article class="card"><span class="label">실린더 동작</span><strong id="motion" class="value">--</strong></article>
 <article class="card"><span class="label">현재 추론</span><strong id="prediction" class="value">--</strong></article>
 <article class="card"><span class="label">건강도 / 잔여수명률</span><strong id="health" class="value">--</strong></article>
 <article class="card"><span class="label">마지막 측정</span><strong id="measuredAt" class="value" style="font-size:14px">--</strong></article>
</section>
<section class="charts">
 <article class="card chart-card"><h2>실린더 전진·후진 위치 그래프</h2><div class="muted">전진 시 상승, 후진 시 하강, 정지 시 유지</div><canvas id="positionChart"></canvas></article>
 <article class="card chart-card"><h2>진동·소음 변화</h2><div class="muted">진동 RMS / 소음 RMS 실측 특징값</div><canvas id="sensorChart"></canvas></article>
</section>
<div id="note" class="note">데이터를 불러오는 중입니다.</div>
</main><script src="real-monitor.js"></script></body></html>
