<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스마트 실린더 실시간 모니터링</title>
<style>:root{--bg:#071014;--panel:#101b21;--line:#263943;--text:#eaf2f5;--muted:#89a0aa;--blue:#42c7ff;--green:#3ce28b;--red:#ff626b;--yellow:#ffc04c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1280px;margin:auto;padding:24px}header,.card,.note{border:1px solid var(--line);background:var(--panel);border-radius:14px}header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;margin-bottom:18px}h1{margin:0;font-size:23px}.muted,.label,.note{color:var(--muted);font-size:12px}.actions{display:flex;align-items:center;gap:14px}.nav{padding:10px 14px;border:1px solid var(--blue);border-radius:8px;color:var(--blue);text-decoration:none}.connection{font:12px monospace;color:var(--yellow)}.ok{color:var(--green)}.bad,.fault{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{padding:18px}.value{display:block;margin-top:9px;font:700 20px monospace}.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}canvas{width:100%;height:250px;margin-top:12px;background:#081116;border-radius:8px}.note{margin-top:18px;padding:14px 18px}@media(max-width:850px){.grid,.charts{grid-template-columns:1fr 1fr}}@media(max-width:600px){header{align-items:flex-start;gap:14px;flex-direction:column}.grid,.charts{grid-template-columns:1fr}}</style></head><body><main class="wrap">
<header><div><h1>스마트 실린더 실시간 데이터</h1><div class="muted">노트북 재생 또는 Raspberry Pi 센서 데이터</div></div><div class="actions"><div id="connection" class="connection">연결 확인 중</div><a class="nav" href="smart-cylinder-camera.html">📷 카메라 보기</a></div></header>
<section class="grid"><article class="card"><span class="label">실린더 동작</span><strong id="motion" class="value">--</strong></article><article class="card"><span class="label">종합 판정</span><strong id="prediction" class="value">--</strong></article><article class="card"><span class="label">건강 점수</span><strong id="health" class="value">--</strong></article><article class="card"><span class="label">실제 잔여수명</span><strong id="rul" class="value">--</strong></article><article class="card"><span class="label">음향 진동 판정</span><strong id="vibration" class="value">--</strong></article><article class="card"><span class="label">진동 신뢰도</span><strong id="vibrationConfidence" class="value">--</strong></article><article class="card"><span class="label">소리 판정</span><strong id="sound" class="value">--</strong></article><article class="card"><span class="label">소리 신뢰도</span><strong id="soundConfidence" class="value">--</strong></article></section>
<section class="charts"><article class="card"><h2>실린더 위치</h2><canvas id="positionChart"></canvas></article><article class="card"><h2>음향 RMS 변화</h2><canvas id="sensorChart"></canvas></article></section><div id="note" class="note">데이터를 불러오는 중입니다.</div></main><script src="real-monitor.js"></script></body></html>
